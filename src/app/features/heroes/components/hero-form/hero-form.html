<form class="hero-form" (ngSubmit)="save($event)">
  <div class="hero-form__fields">
    <mat-form-field appearance="outline" class="hero-form__field">
      <mat-label>Name</mat-label>
      <input matInput appUppercase [formControl]="name" maxlength="25" autocomplete="off" />
      <mat-error>3–25 chars. Letters, numbers, spaces or hyphens only.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="hero-form__field">
      <mat-label>Real name</mat-label>
      <input matInput appUppercase [formControl]="realName" maxlength="25" autocomplete="off" />
      <mat-error>3–25 chars. Letters, numbers, spaces or hyphens only.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="hero-form__field">
      <mat-label>Last name</mat-label>
      <input matInput appUppercase [formControl]="lastName" maxlength="25" autocomplete="off" />
      <mat-error>3–25 chars. Letters, numbers, spaces or hyphens only.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="hero-form__field">
      <mat-label>City</mat-label>
      <input matInput appUppercase [formControl]="city" maxlength="25" autocomplete="off" />
      <mat-error>3–25 chars. Letters, numbers, spaces or hyphens only.</mat-error>
    </mat-form-field>
  </div>

  <div class="hero-form__actions">
    <button matButton="outlined" class="btn-secondary" type="button" (click)="cancel()">Cancel</button>
    <button matButton="filled" class="btn-primary" type="submit" (click)="save($event)">Save</button>
  </div>
</form>
