<app-drawer-shell [opened]="opened()" title="New hero" (closed)="close()">
  <div class="list-container">
    <header class="list-container__header">
      <app-input
        class="list-container__search"
        prefix="search"
        placeholder="Search"
        ariaLabel="Search heroes"
        (valueChange)="onSearch($event)"
      />
      <button matButton="filled" class="btn-primary" type="button" (click)="open()">Create new</button>
    </header>

    <app-hero-table [term]="term()" />
  </div>
  <app-hero-form drawer-body (saved)="close()" (cancelled)="close()" />
</app-drawer-shell>
