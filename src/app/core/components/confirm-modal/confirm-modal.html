<div class="confirm-modal">
  <h2 mat-dialog-title class="confirm-modal__title">{{ data.title }}</h2>

  <mat-dialog-content class="confirm-modal__body">
    <p class="confirm-modal__message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="confirm-modal__actions">
    <button
      matButton="outlined"
      class="btn-secondary"
      type="button"
      (click)="data.onCancel()"
    >
      Cancel
    </button>
    <button
      matButton="filled"
      class="btn-primary"
      type="button"
      cdkFocusInitial
      (click)="data.onConfirm()"
    >
      Continue
    </button>
  </mat-dialog-actions>
</div>
