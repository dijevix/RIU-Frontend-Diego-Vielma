<table mat-table [dataSource]="heroes()" class="list mat-shadow-2">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>No.</th>
    <td mat-cell *matCellDef="let hero">{{ hero.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let hero">{{ hero.name }}</td>
  </ng-container>

  <ng-container matColumnDef="realName">
    <th mat-header-cell *matHeaderCellDef>Real name</th>
    <td mat-cell *matCellDef="let hero">{{ hero.realName }}</td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>Last name</th>
    <td mat-cell *matCellDef="let hero">{{ hero.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let hero">{{ hero.city }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions"></th>
    <td mat-cell *matCellDef="let hero" class="actions">
      <app-kebab-menu
        [ariaLabel]="'Actions for ' + hero.name"
        [items]="actions"
        (action)="onAction($event, hero)"
      />
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

<mat-paginator
  [length]="totalHeroes"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  aria-label="Select page"
  (page)="onPage($event)"
>
</mat-paginator>
